<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
<style>
  body {
      background: #FFC0CB;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
  }
     .calculator {
     background: #FF1493;
     pedding: 20px;
     border-radius: 12px;
     width: 250px;
     }
    #layar {
        width: 100%;
        height: 50px;
        background: #2F4F4F;
        color: #DCDCDC;
        font-size: 24px;
        text-alight: right;
        pedding: 5px 10px;
        box-sizing: border-box;
        border: none;
        margin-bottom: 15px;
    }
        .tombol-container {
            display: grid;
            grid-template-columns: repeat(4,10fr);
            gap: 10px;
    }
       button {
           height: 45px;
           font-size: 18px;
           background: #8A9EA7;
           color: white;
           border: none;
           border-radius: 6px;
           cursor: pointer;
       }
        
</style>
<body>
<div class="calculator">
  
  <input type="text" id="juandamonyet" readonly>
    <div class="tombol-container">  
  <button>C</button>
  <button>+</button>
  <button>6</button>
  <button>8</button>
  <button>=</button>
  <button>.</button>
  <button>-</button>
  <button>8</button>
  <button>C</button>
  <button>C</button>
  <button>C</button>
  <button>C</button>
    </div>

  </div>
  
</body>
