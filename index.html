<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
   <style>
         *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
        }

        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            width: 320px;
        }

        #display {
            width: 100%;
            height: 60px;
            background-color: #222;
            color: #fff;
            text-align: right;
            padding: 10px 15px;
            font-size: 2rem;
            border: none;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #555;
            color: #fff;
            transition: background-color 0.2s;
        }

</style>
<body>
<div class="calculator">
  
  <input type="text" id="juandamonyet" readonly>
    <div class="tombol-container">  
  <button>C</button>
  <button>+</button>
  <button>6</button>
  <button>8</button>
  <button>=</button>
  <button>.</button>
  <button>-</button>
  <button>8</button>
  <button>C</button>
  <button>C</button>
  <button>C</button>
  <button>C</button>
    </div>

  </div>
  
</body>
